<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<title>UltraBox Synth Example</title>
		<meta name="robots" content="noindex, nofollow" />
		<style type="text/css">
            html {
                background: var(--page-margin, #112335);
                overflow-x: clip;
                font-size: large;
                font-family: 'Comic Sans MS', sans-serif;
                line-height: 1.3;
                color: var(--primary-text, white);
            }

            body {
                margin: auto;
                overflow-x: visible;
                display: flex;
                flex-direction: column;
                align-items: center;
                align-content: center;
            }

            h1 {
                font-size: 1.7rem;
                text-align: center;
                padding: 5px;
                margin: 0.7em;
                -webkit-text-stroke-width: 0;
                position: sticky;
                top: 0.7em;
                background: #112335;
                border: ridge medium #9A73CF;
                box-shadow: 0 0 100px 50px #112335;
            }

            h2 {
                font-size: 1.5rem;
                text-align: center;
                margin-top: 0.5em;
                margin-bottom: 0.5em;
                -webkit-text-stroke-width: 0;
                color: var(--lala, #AAABEF)
            }

            h3 {
                font-size: 1.2rem;
                margin-top: 0.5em;
                margin-bottom: 0.5em;
                -webkit-text-stroke-width: 0;
                color: var(--lala, #B9CBFF)
            }

            a {
                color: var(--link-accent, #98f);
            }

            code {
                background-color: var(--eee, #011325);
                padding: 2px 2px;
                border: thin, solid;
                border-radius: inherit;
            }



		</style>
	</head>
	<body>
	
        <button onclick="reset()">Reset</button>

	</body>
</html>

<script type="text/javascript" src="achievements.js">

</script>
